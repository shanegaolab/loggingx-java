# Overrides src/main/resources/application.yml (config/ takes precedence) so tests never touch the MySQL server.
# Each application context gets its own empty database.
spring:
  datasource:
    url: jdbc:h2:mem:${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    hikari:
      maximum-pool-size: 2
