spring:
  application:
    name: loggingx
  # Local overrides for the LOGGINGX_* placeholders below, read from .env in the working directory
  # (see .env.example). Real environment variables take precedence.
  config:
    import: optional:file:.env[.properties]
  # Spring AI's chat auto-configurations register every provider even without an API key;
  # AiConfiguration (loggingx-ai) imports them only for the providers whose key is set.
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.anthropic.autoconfigure.AnthropicChatAutoConfiguration
      - org.springframework.ai.model.deepseek.autoconfigure.DeepSeekChatAutoConfiguration
  mvc:
    async:
      # Bounds streamed responses (/api/ai/chat/stream); long model answers outlast the container's 30 s default.
      request-timeout: 5m
  ai:
    # Only chat is used: turn off the OpenAI starter's other models, and the ChatClient.Builder bean,
    # which needs exactly one ChatModel (AiChatService builds one ChatClient per provider instead).
    model:
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    chat:
      client:
        enabled: false
    # A provider is enabled when its API key is set. Base URLs are set explicitly so the SDKs do not pick up
    # OPENAI_BASE_URL / ANTHROPIC_BASE_URL from the environment; point them at a compatible gateway if needed.
    openai:
      api-key: ${LOGGINGX_AI_OPENAI_API_KEY:}
      base-url: ${LOGGINGX_AI_OPENAI_BASE_URL:https://api.openai.com/v1}
      chat:
        options:
          model: ${LOGGINGX_AI_OPENAI_MODEL:gpt-5-mini}
    anthropic:
      api-key: ${LOGGINGX_AI_ANTHROPIC_API_KEY:}
      base-url: ${LOGGINGX_AI_ANTHROPIC_BASE_URL:https://api.anthropic.com}
      chat:
        options:
          model: ${LOGGINGX_AI_ANTHROPIC_MODEL:claude-haiku-4-5}
    deepseek:
      api-key: ${LOGGINGX_AI_DEEPSEEK_API_KEY:}
      base-url: ${LOGGINGX_AI_DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${LOGGINGX_AI_DEEPSEEK_MODEL:deepseek-flash}
  datasource:
    # The driver caches prepared statements per connection, which pays off with a pool.
    url: ${LOGGINGX_DATASOURCE_URL:jdbc:mysql://localhost:3306/loggingx?characterEncoding=UTF-8&useServerPrepStmts=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048}
    username: ${LOGGINGX_DATASOURCE_USERNAME:loggingx}
    password: ${LOGGINGX_DATASOURCE_PASSWORD:}
    # HikariCP connection pool; times are in milliseconds.
    hikari:
      pool-name: loggingx-pool
      # A fixed-size pool, as HikariCP recommends: minimum-idle defaults to maximum-pool-size.
      maximum-pool-size: ${LOGGINGX_DATASOURCE_POOL_SIZE:10}
      # How long a request waits for a free connection before failing (default 30 s).
      connection-timeout: 10000
      # Ping idle connections so firewalls and NAT gateways do not silently drop them.
      keepalive-time: 300000
  sql:
    init:
      # Creates missing tables at startup; the script only uses CREATE TABLE IF NOT EXISTS.
      mode: always
      schema-locations: classpath:db/schema.sql
  # Lettuce shares one thread-safe connection across threads, so no connection pool is configured.
  data:
    redis:
      host: ${LOGGINGX_REDIS_HOST:localhost}
      port: ${LOGGINGX_REDIS_PORT:6379}
      password: ${LOGGINGX_REDIS_PASSWORD:}
      database: ${LOGGINGX_REDIS_DATABASE:0}
      connect-timeout: 3s
      # Keeps a slow or unreachable Redis from stalling logins for long.
      timeout: 2s
  # Kafka connection for KafkaLogListener, which only runs when loggingx.log.kafka.enabled is true.
  kafka:
    bootstrap-servers: ${LOGGINGX_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # A new consumer group starts at the newest messages rather than replaying the topic's history.
      auto-offset-reset: ${LOGGINGX_KAFKA_AUTO_OFFSET_RESET:latest}
      max-poll-records: 500
    admin:
      # The application creates no topics, so it never needs to reach Kafka unless the consumer is enabled.
      auto-create: false

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  # Registers UtcInstantTypeHandler in place of MyBatis' time-zone dependent Instant handling.
  type-handlers-package: com.loggingx.dao.support

loggingx:
  cache:
    # Roles and menus are cached in Redis and evicted on every write; this bounds how long a racing read can lag.
    ttl: 10m
  security:
    jwt:
      # Required: at least 32 bytes. Startup fails if it is not set; the dev profile provides a local value.
      # No default here: a value committed to the repository would let anyone sign tokens.
      secret: ${LOGGINGX_JWT_SECRET:}
      expiration: 8h
  bootstrap:
    # When no account holds the super administrator role, one is created with these credentials at startup.
    # The password must satisfy PasswordPolicy; leave it empty to skip (a warning is logged).
    super-admin:
      username: ${LOGGINGX_BOOTSTRAP_ADMIN_USERNAME:superuser}
      password: ${LOGGINGX_BOOTSTRAP_ADMIN_PASSWORD:}
  log:
    # Where log lines are kept: clickhouse, or memory (lost on restart; for local runs without ClickHouse).
    storage: ${LOGGINGX_LOG_STORAGE:clickhouse}
    memory:
      capacity-per-store: 50000
    # Daily cleanup of expired logs and of deleted stores' logs (second minute hour day month weekday).
    retention-cron: "0 30 3 * * *"
    tail:
      # How often the live view looks for new logs, and how old a log must be before it is shown, giving inserts
      # still in flight on other instances time to land.
      poll-interval: 1000
      settle-delay: 2s
    kafka:
      # Consume logs that collector agents publish to Kafka (see spring.kafka for the connection).
      enabled: ${LOGGINGX_KAFKA_ENABLED:false}
      # Comma-separated.
      topics: ${LOGGINGX_KAFKA_TOPICS:loggingx-logs}
      group-id: ${LOGGINGX_KAFKA_GROUP_ID:loggingx}
  # Log line storage when loggingx.log.storage is clickhouse; the database must exist, the table is created.
  clickhouse:
    url: ${LOGGINGX_CLICKHOUSE_URL:jdbc:clickhouse://localhost:8123/loggingx}
    username: ${LOGGINGX_CLICKHOUSE_USERNAME:default}
    password: ${LOGGINGX_CLICKHOUSE_PASSWORD:}
    pool-size: ${LOGGINGX_CLICKHOUSE_POOL_SIZE:5}
  # Log archiving to S3-compatible storage (configured on the backup page), see docs/backup.md.
  backup:
    # Daily archive run, before the log retention cleanup (second minute hour day month weekday).
    cron: ${LOGGINGX_BACKUP_CRON:0 30 2 * * *}
    # Encrypts the stored secret key and signs download links; changing it requires entering the secret key again.
    secret: ${LOGGINGX_BACKUP_SECRET:${loggingx.security.jwt.secret}}
  # Host resource monitoring by the agents, stored like the logs (loggingx.log.storage).
  monitor:
    # Days host metrics are kept (busy processes at most 3 days).
    retention-days: ${LOGGINGX_MONITOR_RETENTION_DAYS:15}
    # How often alert rules are evaluated, in milliseconds.
    alert-interval: 60000
  # The log collection agent (Vector) deployed from the agent page, see AgentProperties.
  agent:
    version: ${LOGGINGX_AGENT_VERSION:0.58.0}
    # Packages are served from package-dir when mirrored there (for hosts without internet access), otherwise
    # downloaded from the upstream release.
    upstream-url: ${LOGGINGX_AGENT_UPSTREAM_URL:https://github.com/vectordotdev/vector/releases/download}
    package-dir: ${LOGGINGX_AGENT_PACKAGE_DIR:}
    # Container image for Docker and Kubernetes; defaults to timberio/vector:<version>-alpine.
    image: ${LOGGINGX_AGENT_IMAGE:}
    # How agents reach LoggingX, e.g. https://logs.example.com; defaults to the address the agent page is opened at.
    server-url: ${LOGGINGX_AGENT_SERVER_URL:}
api:
  prefix: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info
