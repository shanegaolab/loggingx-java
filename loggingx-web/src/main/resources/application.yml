spring:
  application:
    name: loggingx

loggingx:
  security:
    jwt:
      # Required: at least 32 bytes. Startup fails if it is not set; the dev profile provides a local value.
      secret: ${LOGGINGX_SECURITY_JWT_SECRET:}
      expiration: ${LOGGINGX_SECURITY_JWT_EXPIRATION:2h}
  bootstrap:
    # When no account holds the super administrator role, one is created with these credentials at startup.
    # The password must satisfy PasswordPolicy; leave it empty to skip (a warning is logged).
    super-admin:
      username: ${LOGGINGX_BOOTSTRAP_SUPER_ADMIN_USERNAME:super}
      password: ${LOGGINGX_BOOTSTRAP_SUPER_ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
